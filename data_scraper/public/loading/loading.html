<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loading • Office Hours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Adjust path if needed to match your static setup -->
  <link rel="stylesheet" href="/static/loading/loading.css" />
</head>
<body>
  <div id="stage">
    <div class="loading-content">
      <div class="loading-header">
        <div class="loading-pill">
          <span class="pill-dot"></span>
          <span class="pill-text">Office Hours</span>
        </div>
        <h1 class="loading-title">Getting things ready…</h1>
        <p class="loading-subtitle">
          We’re connecting to Canvas and preparing your course workspace.
          This should only take a moment.
        </p>
      </div>

      <div class="loading-center">
        <div class="spinner-ring">
          <div class="spinner-segment"></div>
        </div>
        <span class="loading">Loading</span>
      </div>

      <p class="loading-hint">
        You can keep this tab open while we sync your data and set up your chat.
      </p>
    </div>
  </div>
</body>
</html>
